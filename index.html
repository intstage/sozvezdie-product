<!--
  Обёртка отчёта «Продукт Созвездия» для Telegram Mini App и браузера.
  Показывает веб-приложение Apps Script во весь экран (так нет плашки «создано пользователем Google Apps Script»)
  и по запросу отчёта передаёт ему initData — подписанные Telegram данные о том, кто открыл.
  Сама обёртка ничего не хранит и никуда данные не отправляет.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg, #fff); }
  /* --top — отступ под кнопки Telegram в полноэкранном режиме (0 в обычном окне и в браузере) */
  body { --top: 0px; padding-top: var(--top); box-sizing: border-box; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  /* Вход из браузера: карточка поверх отчёта с кнопкой «Войти через Telegram» */
  #login { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 26, 43, .55); font: 15px/1.45 Roboto, Arial, "Segoe UI", sans-serif; z-index: 10; }
  #login.on { display: flex; }
  #login .card { background: #fff; color: #38434D; border-radius: 14px; padding: 22px 22px 18px; max-width: 380px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.25); text-align: center; }
  #login h2 { margin: 0 0 6px; font: 600 19px/1.3 Montserrat, Roboto, Arial, sans-serif; color: #103A60; }
  #login p { margin: 0 0 14px; }
  #login .hint { font-size: 12.5px; color: #66727D; margin: 12px 0 0; }
  #login iframe { width: 240px; height: 42px; border: 0; margin: 0 auto; display: block; }
</style>

<body>
<script>
  // Цвет темы отчёта с прошлого раза — чтобы при открытии не мелькала белая полоса (сам отчёт присылает «sz-theme»).
  try { var bg0 = localStorage.getItem('pa-bg'); if (/^#[0-9a-f]{6}$/i.test(bg0)) document.documentElement.style.setProperty('--bg', bg0); } catch (e) {}
</script>
<iframe id="app" aria-label="Продукт Созвездия" allow="clipboard-write"
  src="report.html?v=e02efd6f97"></iframe>
<script>
  var tg = window.Telegram && Telegram.WebApp;
  if (tg && tg.initData) {
    tg.ready();
    tg.expand();                                   // на всю высоту (телефон)
    // На компьютере Telegram открывает Mini App маленьким окном — просим полноэкранный режим.
    // На телефоне не просим: там полноэкранный режим закрывает верх страницы кнопками Telegram.
    var desktop = /^(tdesktop|macos|web|weba|webk)$/.test(tg.platform);
    if (desktop && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
      try { tg.requestFullscreen(); } catch (e) {}
    }
    // В полноэкранном режиме отодвигаем отчёт от кнопок Telegram на отступ, который сообщает сам Telegram.
    // На компьютере строка Telegram (крестик, вкладки) стоит НАД отчётом, а не поверх него — отступ там
    // давал пустую белую полосу, поэтому на компьютере он 0. Телефон в полноэкранный режим не переводим.
    var insets = function () {
      var top = tg.isFullscreen && !desktop ? ((tg.safeAreaInset && tg.safeAreaInset.top) || 0) + ((tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0) : 0;
      document.body.style.setProperty('--top', top + 'px');
    };
    ['fullscreenChanged', 'safeAreaChanged', 'contentSafeAreaChanged'].forEach(function (ev) { try { tg.onEvent(ev, insets); } catch (e) {} });
    insets();
  }
  // Фон обёртки и шапка Telegram — в цвет темы отчёта (светлая / тёмная), иначе сверху и снизу белые полосы.
  var paint = function (bg) {
    if (!/^#[0-9a-f]{6}$/i.test(bg)) return;
    document.documentElement.style.setProperty('--bg', bg);
    try { localStorage.setItem('pa-bg', bg); } catch (e) {}
    if (tg && tg.initData) {
      try { tg.setHeaderColor(bg); } catch (e) {}
      try { tg.setBackgroundColor(bg); } catch (e) {}
      try { if (tg.setBottomBarColor) tg.setBottomBarColor(bg); } catch (e) {}
    }
  };
  paint(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff');
  // Отчёт (внутри iframe от googleusercontent.com) присылает «sz-hello» — отвечаем ему данными Telegram.
  var canFs = !!(tg && tg.initData && /^(tdesktop|macos|web|weba|webk)$/.test(tg.platform) && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0'));
  // Куда открыть отчёт: ссылка из сообщения бота (t.me/<бот>?startapp=…) или кнопка (…/?go=…). Только безопасные символы.
  var go = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('go') || '';
  if (!/^[A-Za-z0-9_-]{1,512}$/.test(go)) go = '';
  var report = null;                                 // окно отчёта и его адрес — чтобы сообщать о смене режима
  // Режим окна помним сами: Telegram для компьютера (macOS) переключает режим, но не присылает fullscreenChanged,
  // и tg.isFullscreen у него не меняется. Если событие всё же пришло — верим ему.
  var fsOn = !!(tg && tg.isFullscreen);
  var fsInfo = function () { return { canFullscreen: canFs, isFullscreen: fsOn }; };
  var fsSend = function () { if (report) report.win.postMessage(Object.assign({ type: 'sz-fs' }, fsInfo()), report.origin); };
  if (canFs) {
    tg.onEvent('fullscreenChanged', function () { fsOn = !!tg.isFullscreen; fsSend(); });
    // Уже во весь экран, а мы просили развернуть — значит, хотели свернуть: сворачиваем.
    // Режим не поддерживается — прячем кнопку ⛶ в отчёте.
    tg.onEvent('fullscreenFailed', function (ev) {
      var err = ev && ev.error;
      if (err === 'ALREADY_FULLSCREEN') { fsOn = false; try { tg.exitFullscreen(); } catch (e) {} }
      else if (err === 'UNSUPPORTED') canFs = false;
      fsSend();
    });
  }
  // Одно окно отчёта: кнопка под сообщением открывает новое окно приложения — новое сообщает о себе,
  // а прежние закрываются (BroadcastChannel; запасной путь — событие storage). Только внутри Telegram.
  if (tg && tg.initData) {
    var born = Date.now() + Math.random();
    var older = function (at) { if (+at > born) { try { tg.close(); } catch (e) {} } };
    try {
      var bc = new BroadcastChannel('sz-pa-window');
      bc.onmessage = function (e) { if (e.data && e.data.type === 'open') older(e.data.at); };
      bc.postMessage({ type: 'open', at: born });
    } catch (e) {}
    window.addEventListener('storage', function (e) { if (e.key === 'sz-pa-window') older(e.newValue); });
    try { localStorage.setItem('sz-pa-window', String(born)); } catch (e) {}
  }
  // Приложение уже открыто, а нажата другая ссылка t.me/<бот>?startapp=…: Telegram не перезагружает страницу,
  // а меняет tgWebAppStartParam в адресе после # (или просто показывает окно). Проверяем адрес и передаём отчёту новое место.
  var lastGo = go;
  var goCheck = function () {
    var g = '';
    try { g = new URLSearchParams(location.hash.slice(1)).get('tgWebAppStartParam') || ''; } catch (e) {}
    if (!/^[A-Za-z0-9_-]{1,512}$/.test(g) || g === lastGo) return;
    lastGo = g;
    if (report) report.win.postMessage({ type: 'sz-go', go: g }, report.origin);
  };
  window.addEventListener('hashchange', goCheck);
  window.addEventListener('focus', goCheck);
  document.addEventListener('visibilitychange', goCheck);
  if (tg) try { tg.onEvent('activated', goCheck); } catch (e) {}
  var LOGIN_KEY = 'pa-login';   // вход из браузера, в этом браузере
  // ---- Вход из браузера (не из Telegram): окно входа Telegram Login от oauth.telegram.org ----
  // Скрипт-виджет Telegram не используем: он вызывает функцию через eval, а политика страницы это запрещает.
  // Встраиваем то же окно сами и принимаем от него данные входа (event = auth_user) только с oauth.telegram.org.
  var LOGIN_DAYS = 7;
  var tgRejected = false;   // сервер не принял данные Telegram — дальше входим через окно входа
  var savedLogin = function () {
    try {
      var s = localStorage.getItem(LOGIN_KEY) || '', m = s.match(/(?:^login:|&)auth_date=(\d+)/);
      if (m && Date.now() / 1000 - +m[1] < LOGIN_DAYS * 86400 - 3600) return s;
      localStorage.removeItem(LOGIN_KEY);
    } catch (e) {}
    return '';
  };
  var loginBox = null;
  var showLogin = function (bot) {
    if (!/^[A-Za-z0-9_]{3,64}$/.test(bot)) return;
    try { localStorage.removeItem(LOGIN_KEY); } catch (e) {}
    if (!loginBox) {
      loginBox = document.createElement('div');
      loginBox.id = 'login';
      loginBox.innerHTML = '<div class="card"><h2>Вход в отчёт</h2><p>Войдите через Telegram — так же, как в боте. Доступ проверяется по списку сотрудников.</p>' +
        '<iframe title="Войти через Telegram" scrolling="no"></iframe>' +
        '<p class="hint">Telegram пришлёт запрос на подтверждение входа. Вход запомнится в этом браузере на ' + LOGIN_DAYS + ' дней.</p></div>';
      document.body.appendChild(loginBox);
    }
    loginBox.querySelector('iframe').src = 'https://oauth.telegram.org/embed/' + bot + '?origin=' + encodeURIComponent(location.origin) +
      '&return_to=' + encodeURIComponent(location.href.split('#')[0]) + '&size=large&userpic=false&request_access=write&radius=10&lang=ru';
    loginBox.className = 'on';
  };
  // ---- Этап 2 (#58): данные запрашиваем сразу при открытии, не дожидаясь страницы отчёта ----
  // SZ_API подставляет сборка tools/miniapp_build.py (пусто — отчёт из Apps Script, запроса нет). Страница report.html
  // с этого же сайта забирает ответ из window.SZ_PREFETCH. have — метка копии на устройстве (IndexedDB страницы):
  // если данные не менялись, сервер ответит коротко.
  var SZ_API = 'https://script.google.com/macros/s/AKfycbxQRhlLdTt72Ib1YKrj8iz4in3tkQiPzdoU1yQuS5XwDsWtdWkg8GhPQAKSpdLGIrN4ug/exec';
  window.SZ_PREFETCH = null;
  (function () {
    var init = (tg && tg.initData) || savedLogin();
    if (!SZ_API || !init || !window.fetch) return;
    var have = new Promise(function (res) {
      try {
        var r = indexedDB.open('sz-cache', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () {
          try { var q = r.result.transaction('kv').objectStore('kv').get('pa-last'); q.onsuccess = function () { res(q.result && q.result.v || ''); }; q.onerror = function () { res(''); }; }
          catch (e) { res(''); }
        };
        r.onerror = function () { res(''); };
      } catch (e) { res(''); }
    });
    window.SZ_PREFETCH = { init: init, res: have.then(function (v) {
      return fetch(SZ_API, { method: 'POST', body: JSON.stringify({ fn: 'data', init: init, have: v }), redirect: 'follow', credentials: 'omit' });
    }).then(function (r) { if (!r.ok) throw new Error('Сервер ответил ' + r.status); return r.text(); }) };
    window.SZ_PREFETCH.res.catch(function () {});              // ошибку покажет страница, когда заберёт ответ
  })();
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://oauth.telegram.org' || !loginBox) return;
    var d = {};
    try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data || {}; } catch (err) { return; }
    if (d.event === 'resize' && d.height) loginBox.querySelector('iframe').style.height = d.height + 'px';
    if (d.event !== 'auth_user' || !d.auth_data || !d.auth_data.hash) return;
    var u = d.auth_data, data = 'login:' + Object.keys(u).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(u[k]); }).join('&');
    try { localStorage.setItem(LOGIN_KEY, data); } catch (err) {}
    loginBox.className = '';
    if (report) report.win.postMessage({ type: 'sz-login', initData: data }, report.origin);
  });
  window.addEventListener('message', function (e) {
    // только отчёту: страница с этого же сайта (report.html, этап 2) или веб-приложение Apps Script
    if (!e.data || !(e.origin === location.origin || /\.googleusercontent\.com$/.test(new URL(e.origin).hostname))) return;
    if (e.data.type === 'sz-hello') {
      report = { win: e.source, origin: e.origin };
      e.source.postMessage(Object.assign({ type: 'sz-tg', initData: (!tgRejected && tg && tg.initData) || savedLogin(), go: go }, fsInfo()), e.origin);
    }
    if (e.data.type === 'sz-theme') paint(String(e.data.bg || ''));
    // Отчёт просит вход: открыт не из Telegram, вход устарел или сервер не принял данные Telegram
    // (так бывает в веб-версии Telegram). Сначала пробуем сохранённый вход из браузера, иначе — кнопка «Войти через Telegram».
    if (e.data.type === 'sz-need-login') {
      var saved = savedLogin(), viaTg = !!(tg && tg.initData && !tgRejected);
      tgRejected = true;
      if (viaTg && saved && report) report.win.postMessage({ type: 'sz-login', initData: saved }, report.origin);
      else showLogin(String(e.data.bot || ''));
    }
    if (e.data.type === 'sz-fs-toggle' && canFs) {
      var exit = fsOn;
      fsOn = !exit;
      try { exit ? tg.exitFullscreen() : tg.requestFullscreen(); } catch (err) {}
      fsSend();                                      // значок меняем сразу, не дожидаясь Telegram
    }
  });
</script>
</body>
</html>
